<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTC/USDT Chart</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0e1117;
      color: #e6e6e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #2a2e39;
    }
    #symbol {
      font-size: 14px;
      color: #9098a3;
      letter-spacing: 0.05em;
    }
    #last-price {
      font-size: 28px;
      font-weight: 600;
    }
    #status {
      margin-left: auto;
      font-size: 12px;
      color: #9098a3;
    }
    #status.live { color: #26a69a; }
    #status.down { color: #ef5350; }
    #chart {
      width: 100%;
      height: calc(100vh - 56px);
    }
  </style>
</head>
<body>
  <div id="header">
    <span id="symbol">BTC_USDT</span>
    <span id="last-price">--</span>
    <span id="status">connecting…</span>
  </div>
  <div id="chart"></div>

  <!-- Pinned to 4.2.3: v5 removed chart.addCandlestickSeries(), which this page uses. -->
  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    // Read-only price chart. No order controls, no trading actions.

    const priceEl = document.getElementById("last-price");
    const statusEl = document.getElementById("status");
    const symbolEl = document.getElementById("symbol");
    const chartEl = document.getElementById("chart");

    const chart = LightweightCharts.createChart(chartEl, {
      layout: {
        background: { color: "#0e1117" },
        textColor: "#d1d4dc",
      },
      grid: {
        vertLines: { color: "#1e222d" },
        horzLines: { color: "#1e222d" },
      },
      timeScale: { timeVisible: true, secondsVisible: false },
    });
    const candleSeries = chart.addCandlestickSeries({
      upColor: "#26a69a",
      downColor: "#ef5350",
      borderVisible: false,
      wickUpColor: "#26a69a",
      wickDownColor: "#ef5350",
    });

    window.addEventListener("resize", () => {
      chart.resize(chartEl.clientWidth, chartEl.clientHeight);
    });
    chart.resize(chartEl.clientWidth, chartEl.clientHeight);

    let currentBar = null;

    function barIntervalSeconds() {
      return 15 * 60; // Min15
    }

    fetch("/kline")
      .then((r) => r.json())
      .then((payload) => {
        const data = payload && payload.data ? payload.data : null;
        if (!data || !Array.isArray(data.t)) return;
        const bars = data.t.map((t, i) => ({
          time: Math.floor(Number(t) / 1000),
          open: Number(data.o[i]),
          high: Number(data.h[i]),
          low: Number(data.l[i]),
          close: Number(data.c[i]),
        }));
        candleSeries.setData(bars);
        if (bars.length) {
          currentBar = { ...bars[bars.length - 1] };
        }
      })
      .catch(() => {
        statusEl.textContent = "kline load failed";
      });

    function wsUrl() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      return proto + "://" + location.host + "/ws";
    }

    function connect() {
      const ws = new WebSocket(wsUrl());

      ws.onopen = () => {
        statusEl.textContent = "live";
        statusEl.className = "live";
      };

      ws.onmessage = (event) => {
        let msg;
        try {
          msg = JSON.parse(event.data);
        } catch (e) {
          return;
        }
        if (!msg || msg.type !== "tick") return;

        if (msg.symbol) symbolEl.textContent = msg.symbol;
        if (typeof msg.last === "number" && msg.last > 0) {
          priceEl.textContent = msg.last.toFixed(2);

          const tsSec = msg.ts_ms ? Math.floor(msg.ts_ms / 1000) : Math.floor(Date.now() / 1000);
          const barTime = tsSec - (tsSec % barIntervalSeconds());

          if (currentBar === null || barTime > currentBar.time) {
            currentBar = {
              time: barTime,
              open: msg.last,
              high: msg.last,
              low: msg.last,
              close: msg.last,
            };
          } else if (barTime === currentBar.time) {
            currentBar.high = Math.max(currentBar.high, msg.last);
            currentBar.low = Math.min(currentBar.low, msg.last);
            currentBar.close = msg.last;
          }
          candleSeries.update(currentBar);
        }
      };

      ws.onclose = () => {
        statusEl.textContent = "disconnected — retrying…";
        statusEl.className = "down";
        setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    connect();
  </script>
</body>
</html>

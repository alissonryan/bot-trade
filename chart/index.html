<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTC/USDT Chart</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0e1117;
      color: #e6e6e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #2a2e39;
    }
    #symbol {
      font-size: 14px;
      color: #9098a3;
      letter-spacing: 0.05em;
    }
    #last-price {
      font-size: 28px;
      font-weight: 600;
    }
    #status {
      margin-left: auto;
      font-size: 12px;
      color: #9098a3;
    }
    #status.live { color: #26a69a; }
    #status.down { color: #ef5350; }
    #intervals {
      display: flex;
      gap: 4px;
    }
    #intervals button {
      background: transparent;
      border: 1px solid #2a2e39;
      border-radius: 3px;
      color: #9098a3;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      padding: 3px 8px;
    }
    #intervals button:hover { border-color: #3d4351; color: #d1d4dc; }
    #intervals button[aria-pressed="true"] {
      background: #1e222d;
      border-color: #3d4351;
      color: #e6e6e6;
    }
    /* The bot decides on Min15 no matter what the chart is showing. Anything
       else is a viewing lens, and says so rather than implying the strategy
       moved with it. */
    #decides-on {
      font-size: 11px;
      color: #6b7280;
    }
    #chart {
      width: 100%;
      height: calc(100vh - 56px);
    }
  </style>
</head>
<body>
  <div id="header">
    <span id="symbol">BTC_USDT</span>
    <span id="last-price">--</span>
    <span id="intervals">
      <button type="button" data-interval="Min1" data-seconds="60">1m</button>
      <button type="button" data-interval="Min5" data-seconds="300">5m</button>
      <button type="button" data-interval="Min15" data-seconds="900">15m</button>
      <button type="button" data-interval="Min30" data-seconds="1800">30m</button>
      <button type="button" data-interval="Min60" data-seconds="3600">1h</button>
      <button type="button" data-interval="Hour4" data-seconds="14400">4h</button>
      <button type="button" data-interval="Hour8" data-seconds="28800">8h</button>
      <button type="button" data-interval="Day1" data-seconds="86400">1D</button>
    </span>
    <span id="decides-on"></span>
    <span id="status">connecting…</span>
  </div>
  <div id="chart"></div>

  <!-- Pinned to 4.2.3: v5 removed chart.addCandlestickSeries(), which this page uses. -->
  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    // Read-only price chart. No order controls, no trading actions.

    const priceEl = document.getElementById("last-price");
    const statusEl = document.getElementById("status");
    const symbolEl = document.getElementById("symbol");
    const chartEl = document.getElementById("chart");

    const chart = LightweightCharts.createChart(chartEl, {
      layout: {
        background: { color: "#0e1117" },
        textColor: "#d1d4dc",
      },
      grid: {
        vertLines: { color: "#1e222d" },
        horzLines: { color: "#1e222d" },
      },
      timeScale: { timeVisible: true, secondsVisible: false },
    });
    const candleSeries = chart.addCandlestickSeries({
      upColor: "#26a69a",
      downColor: "#ef5350",
      borderVisible: false,
      wickUpColor: "#26a69a",
      wickDownColor: "#ef5350",
    });

    window.addEventListener("resize", () => {
      chart.resize(chartEl.clientWidth, chartEl.clientHeight);
    });
    chart.resize(chartEl.clientWidth, chartEl.clientHeight);

    let currentBar = null;

    // The interval the bot itself trades on. The buttons change what this page
    // *shows*; they do not and must not change what the bot decides on.
    const BOT_INTERVAL = "Min15";
    const buttons = Array.from(document.querySelectorAll("#intervals button"));
    let interval = BOT_INTERVAL;
    let intervalSeconds = 15 * 60;
    // Rising token: a slow reply for an interval the user already left must not
    // overwrite the bars of the one they are now looking at.
    let loadToken = 0;
    // False from the moment an interval is chosen until its bars are actually in
    // the series. A tick arriving in that gap would be bucketed on the NEW grid
    // while the series still holds the OLD interval's bars, and the library
    // rejects a bar older than its last one ("Cannot update oldest data").
    let seriesReady = false;
    // Newest bar time in the series, so an out-of-order tick can never rewind it.
    let newestBarTime = 0;

    function barIntervalSeconds() {
      return intervalSeconds;
    }

    function loadKline() {
      const token = ++loadToken;
      const asked = interval;
      fetch("/kline?interval=" + encodeURIComponent(asked))
        .then((r) => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
        .then((payload) => {
          if (token !== loadToken) return; // superseded by a later click
          const data = payload && payload.data ? payload.data : null;
          if (!data || !Array.isArray(data.t)) return;
          const bars = data.t.map((t, i) => ({
            // KCEX accepts request bounds in ms but returns candle times in seconds.
            time: Number(t),
            open: Number(data.o[i]),
            high: Number(data.h[i]),
            low: Number(data.l[i]),
            close: Number(data.c[i]),
          }));
          candleSeries.setData(bars);
          // Reset, never carry: a bar from the previous interval has a time on
          // the old grid, so keeping it would make the next tick either extend
          // a stale candle or open one at the wrong boundary.
          currentBar = bars.length ? { ...bars[bars.length - 1] } : null;
          newestBarTime = bars.length ? bars[bars.length - 1].time : 0;
          seriesReady = true;
          chart.timeScale().fitContent();
        })
        .catch(() => {
          if (token !== loadToken) return;
          statusEl.textContent = "kline load failed";
        });
    }

    function selectInterval(name, seconds) {
      interval = name;
      intervalSeconds = seconds;
      currentBar = null;
      seriesReady = false;
      buttons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.interval === name)));
      document.getElementById("decides-on").textContent =
        name === BOT_INTERVAL ? "" : "viewing only — the bot decides on 15m";
      loadKline();
    }

    buttons.forEach((b) => {
      b.addEventListener("click", () =>
        selectInterval(b.dataset.interval, Number(b.dataset.seconds))
      );
    });

    selectInterval(BOT_INTERVAL, 15 * 60);

    function wsUrl() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      return proto + "://" + location.host + "/ws";
    }

    function connect() {
      const ws = new WebSocket(wsUrl());

      ws.onopen = () => {
        statusEl.textContent = "live";
        statusEl.className = "live";
      };

      ws.onmessage = (event) => {
        let msg;
        try {
          msg = JSON.parse(event.data);
        } catch (e) {
          return;
        }
        if (!msg || msg.type !== "tick") return;

        if (msg.symbol) symbolEl.textContent = msg.symbol;
        if (typeof msg.last === "number" && msg.last > 0) {
          priceEl.textContent = msg.last.toFixed(2);

          // The price readout is always current; only the candle waits for the
          // series to match the interval the tick is about to be bucketed on.
          if (!seriesReady) return;

          const tsSec = msg.ts_ms ? Math.floor(msg.ts_ms / 1000) : Math.floor(Date.now() / 1000);
          const barTime = tsSec - (tsSec % barIntervalSeconds());
          if (barTime < newestBarTime) return; // never rewind the series

          if (currentBar === null || barTime > currentBar.time) {
            newestBarTime = barTime;
            currentBar = {
              time: barTime,
              open: msg.last,
              high: msg.last,
              low: msg.last,
              close: msg.last,
            };
          } else if (barTime === currentBar.time) {
            currentBar.high = Math.max(currentBar.high, msg.last);
            currentBar.low = Math.min(currentBar.low, msg.last);
            currentBar.close = msg.last;
          }
          candleSeries.update(currentBar);
        }
      };

      ws.onclose = () => {
        statusEl.textContent = "disconnected — retrying…";
        statusEl.className = "down";
        setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    connect();
  </script>
</body>
</html>
